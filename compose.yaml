services:
  nginx:
    container_name: Agrekom_249-nginx
    image: nginx:1.28-alpine
    ports: ["${HTTP_PORT:-8080}:80"]
    volumes:
      - ${MAGENTO_SRC:-./src}:/var/www/html:cached
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/fastcgi_params:/etc/nginx/fastcgi_params:ro
    depends_on: [php]

  php:
    container_name: Agrekom_249-php
    build: ./php
    working_dir: /var/www/html
    volumes:
      - ${MAGENTO_SRC:-./src}:/var/www/html:cached
      - ./auth.json:/var/www/.composer/auth.json:ro
      - composer-cache:/var/www/.composer/cache
      # SSH key for git@bitbucket.org / git@github.com - composer clones the agrekom packages
      - ${SSH_KEY:-~/.ssh/id_rsa}:/var/www/.ssh/id_rsa:ro
      # git identity for commits made inside the container (vendor/agrekom clones)
      - ${GITCONFIG:-~/.gitconfig}:/var/www/.gitconfig:ro
    environment:
      COMPOSER_HOME: /var/www/.composer
    depends_on:
      db: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      valkey: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mailpit: { condition: service_started }

  db:
    container_name: Agrekom_249-db
    image: mysql:8.4
    command: ["--max_allowed_packet=256M", "--innodb_buffer_pool_size=1G", "--log_bin_trust_function_creators=1"]
    ports: ["${DB_PORT:-3306}:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes: [db-data:/var/lib/mysql]
    healthcheck:
      # TCP check: during init MySQL runs with networking disabled
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -e 'select 1'"]
      interval: 5s
      retries: 60

  opensearch:
    container_name: Agrekom_249-opensearch
    build:
      context: .
      dockerfile_inline: |
        FROM opensearchproject/opensearch:3.1.0
        RUN bin/opensearch-plugin install --batch analysis-icu analysis-phonetic
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes: [os-data:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs localhost:9200/_cluster/health"]
      interval: 5s
      retries: 60

  valkey:
    container_name: Agrekom_249-valkey
    image: valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s

  rabbitmq:
    container_name: Agrekom_249-rabbitmq
    image: rabbitmq:4.1-management-alpine
    hostname: rabbitmq
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    ports: ["${RABBITMQ_UI_PORT:-15672}:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 30

  mailpit:
    container_name: Agrekom_249-mailpit
    image: axllent/mailpit:latest
    ports: ["${MAILPIT_PORT:-8025}:8025"]

volumes:
  db-data:
  os-data:
  composer-cache:
  rabbitmq-data:
