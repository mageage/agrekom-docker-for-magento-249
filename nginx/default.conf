# Host -> Magento website code
map $host $mage_run_code {
    default              pl;
    de.localhost         de;
    uk.localhost         uk;
    ewarsztat.localhost  ewarsztat;
}

upstream fastcgi_backend {
    server php:9000;
}
server {
    listen 80;
    server_name localhost uk.localhost de.localhost ewarsztat.localhost;
    set $MAGE_ROOT /var/www/html;
    set $MAGE_MODE developer;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    include /var/www/html/nginx.conf.sample;
}
